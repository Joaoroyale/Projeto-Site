<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta name="viewport" content="width=device-widht, 
    inicial-scale=1.0">
    <meta charset="UTF-8">
    <title>Cadastre seu produto</title>
</head>
<body>
  <h1>Adega</h1>
  <h2>Cadastre seu produto aqui!</h2>

    <form>
        <h3>Insercao de dados basicos:</h3>
        <label for="Identificação">Identificacao</label>
        <br>
        
        <input type="text" name="Nome do produto" id="Nome" required placeholder="Nome do seu produto:">
        <br>

        <input type="text" name="Marca do produto" id="Marca" required placeholder="Marca do seu produto?">
        <br>

        <input type="text" name="Categoria do produto" id="Categoria do produto" required placeholder="Qual a categoria do produto?">
        <br>

        <input type="number" name="Preco do produto" id="Preco" required placeholder="Solicite o preco do seu produto">
        <br>
        
        <h3>Caracteristicas fisicas do produto</h3>
        <p>Tamanho, cores, peso, material da embalagem, </p>
        
        
        <br>
        <label for="embalagem">Modelo de embalagem</label>
        <input type="link" name="link da imagem" id="Modelo de embalagem" required placeholder="Link da imagem do produto">
        <br>

        <label for="Medidas do produto">comprimento,largura</label>

</form>

</body>
</html>
